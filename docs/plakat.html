.bar select{font:inherit;font-size:.85rem;padding:5px 7px;border:1px solid var(--ui-rule);border-radius:5px;background:var(--ui-sheet);color:var(--ui-ink)}
.bar input[type=checkbox]{accent-color:var(--ui-accent)}
.btn{all:unset;cursor:pointer;font-size:.84rem;padding:6px 10px;border:1px solid var(--ui-rule);border-radius:5px;background:var(--ui-sheet);color:var(--ui-ink)}

@media print{

  .bar,.hint{display:none!important}

  #poster{width:100vw;height:100vh}

lerup", "gift"], [1981, "Hune", ""]], "father": null, "mother": null, "living": false, "sibof": null, "step": null, "spouse": "p4"}, {"id": "p6", "name": "Lorenz Heinrich Frederiksen", "sex": "M", "ahnen": 6, "line": "maternal", "rel": null, "born": "1932-01-12", "bplace": "Egernsund", "died": "2009-05-06", "dplace": "Svendborg", "occ": [], "conf": "record", "note": "Det borgerlige fødselsregister for Egernsund (1932 nr. 4, anmeldt 16. jan. 1932) siger, at Else Gedde Frederiksen, f. Jensen, fødte ham 12. jan. 1932 kl. 5.30. En randnote af 11. juli 1932 siger, at landarbejder Wilhelm Krogh fra Snogbæk er den biologiske far. Det bygger på hans faderskabserklæring af 5. april 1932 og en retsafgørelse af 10. juni 1932. Stedfaren Peter Frederiksen gav drengen sit efternavn. Det stemmer med familiens fortælling om, at Lorenz først som voksen fandt ud af, at Peter ikke var hans far. Familien formoder desuden, at den egentlige far var gårdmandssønnen Sofus Petersen fra Paakjær i Nybøl, og at Krogh påtog sig faderskabet. Ifølge dåbsindførslen i Broager Vestre distrikt (1933 nr. 1) var fadderne stedfaren selv, arbejdsmand Lorenz Frederiksen og hustru Catharina, Egernsund, samt gårdejer Jens Jensens hustru fra Dalsgaard. Lorenz er begravet sammen med hustruen Gerda på Sankt Jørgens Kirkegård i Svendborg.", "src": ["AO:Egernsund standsregister, fødte 1928–33, 1932 nr. 4 (bsid 37658, billede 125)", "AO:Broager Vestre distrikt kontraministerialbog 1906–48, fødte 1933 nr. 1 (bsid 201141, billede 112)", "BillionGraves via MyHeritage (samling 10147): Lorenz H. Frederiksen, Sankt Jørgens Kirkegård, Svendborg", "MyHeritage: Folketælling 1940, 'Lorens Henrick Frederiksen'"], "res": [[1932, "Egernsund", "født; hjemmedøbt 1. jan. 1933"], [2009, "Svendborg", "død; begravet på Sankt Jørgens Kirkegård"]], "father": "p12", "mother": "p13", "living": false, "sibof": null, "step": "pf12", "spouse": "p7"}, {"id": "p7", "name": "Gerda Frederiksen", "sex": "F", "ahnen": 7, "line": "maternal", "rel": null, "born": "1935-08-17", "bplace": null, "died": "2019-07-18", "dplace": "Svendborg", "occ": [], "conf": "record", "note": "Begravet på Sankt Jørgens Kirkegård i Svendborg sammen med sin mand Lorenz. Pigenavnet er endnu ukendt. Familien fortæller, at hun er i familie med de Pedersen'er, der arvede Langø i Lindelse Nor på Langeland. Langø blev købt i 1894 af husmand Marius Christensen og hustru Ane Marie, og i 1911 byggede han med sine sønner og svigersøn den 334 m lange dæmning til Langeland. Han blev kaldt 'Kongen af Langø'. Pedersen'erne kan være efterkommere gennem en datter.", "src": ["BillionGraves via MyHeritage (samling 10147): Gerda Frederiksen, Sankt Jørgens Kirkegård, Svendborg", "Familiens oplysninger (Langø)", "Fyens Stiftstidende: Historien om en dæmning"], "res": [], "father": null, "mother": null, "living": false, "sibof": null, "step": null, "spouse": "p6"}, {"id": "p8", "name": "Aage Evald Oskar Jørgensen", "sex": "M", "ahnen": 8, "line": "jorgensen", "rel": null, "born": "1890-10-17", "bplace": "Slagelse", "died": null, "dplace": null, "occ": ["Natvægter, København (1918)", "Gårdbestyrer, Kolind (1921–22)", "Bestyrer af Gjellerup fattiggård (1925)"], "conf": "record", "note": "Gift med Jensine Gaardsted i Kolind Kirke 29. okt. 1921.", "src": ["LL:12-16940206", "LL:9-1795573", "LL:17-1153878", "LL:25-1032486", "AO:27841253", "DFS:18978910"], "res": [[1890, "Slagelse", "født"], [1918, "København", "natvægter"], [1921, "Kolind", "i familien Gaardsteds hus"], [1925, "Gjellerup / Hammerum", "bestyrer af Gjellerup fattiggård"], [1932, "Hadsten", "flyttede hertil med familien"]], "father": "p16", "mother": "p17", "living": false, "sibof": null, "step": null, "spouse": "p9"}, {"id": "p9", "name": "Jensine Mariane Magdalene Gaardsted", "sex": "F", "ahnen": 9, "line": "gaardsted", "rel": null, "born": "1894-06-06", "bplace": "Kolind", "died": null, "dplace": null, "occ": ["Tjenestepige, København (1915)"], "conf": "record", "note": null, "src": ["LL:9 m søn af gårdmand ('Hufner') Peter Petersen og hustru Anna Cathrine Marie f. Petersen i Nybøl. Faddere: gæstgiver Johannes Hansen i Hostrup, tjenestekarl Jürgen Jacobsen i Nybøl og ugift Marie Iversen i Schottsbüllfeld. Fødselsdatoen passer præcist med gravstenen på Nybøl Kirkegård. Familien har fået at vide, at Lorenz' far hed Sophus og var fra Påkjær gård i Nybøl, og at han som gårdmandssøn ikke kunne vedstå faderskabet. Det står i modstrid med standsregistret: i 1932 anerkendte landarbejder Wilhelm Krogh faderskabet, og retten stadfæstede det. Formodningen er altså, at karlen påtog sig faderskabet. Påkjær ligger i Nybøl sogn tæt ved Snogbæk, hvor Krogh var karl i 1932. Sophus døde kun 42 år gammel. Han og hustruen Christine fik tre døtre: Gerda og to andre, hvoraf den ene flyttede til Norge. Er formodningen rigtig, er de Lorenz' halvsøstre. Kun en DNA-test kan afgøre spørgsmålet.", "src": ["AO:Nybøl kirkebog 1880–1931, dåb 1903 nr. 12 (bsid 202179, billede 88)", "LL:12-15057041 (indekseret med dåbsdatoen 24.7.1903)", "Gravsten på Nybøl Kirkegård (foto fra familien): 'Minde over en elsket Mand og Fader Sofus Petersen, Paakjær, * 28. Juni 1903 † 24. Aug. 1945'", "Familiens oplysninger"], "res": [[1903, "Nybøl (Paakjær)", "født på forældrenes gård"], [1945, "Nybøl (Paakjær)", "død; begravet på Nybøl Kirkegård"]], "father": "sofus_f", "mother": "sofus_m", "living": false, "sibof": null, "step": null, "spouse": "sofus_w"}, {"id": "sofus_w", "name": "Christine Petersen (f. Jensen)", "sex": "F", "ahnen": null, "line": "maternal", "rel": "Sophus Petersens hustru", "born": "1907-02-21", "bplace": null, "died": "1985-06-25", "dplace": "Nybøl (Paakjær)", "occ": [], "conf": "record", "note": null, "src": ["Gravsten på Nybøl Kirkegård (foto fra familien): 'og vor kære Moder Christine Petersen f. Jensen * 21. Feb. 1907 † 25. Juni 1985'"], "res": [], "father": null, "mother": null, "living": false, "sibof": null, "step": null, "spouse": "sofus"}, {"id": "sofus_f", "name": "Pete -03-10", "dplace": "Helsingør", "occ": ["Officer: sekondløjtnant, kaptajn (1808), oberstløjtnant og bataljonschef ved Kronens Regiment", "Karakteriseret oberst, ridder af Dannebrog", "Borgerrepræsentant, Helsingør (1823–38)"], "conf": "record", "note": "Gift 24. juni 1806 med Frederikke Louise Dorthea von Kleist. Kaldes 'von Gedde' i folketællingen 1834, hvor familien bor i Helsingør med datteren Henriette (f. 1819). Han er familiens bedste bud på 'kaptajnen' i fortællingen om navnet Gedde: Else Gedde Jensens tipoldefar og kaptajn i 1808. Der er dog intet i kilderne om, at han var i Trankebar.", "src": ["AO:Fredensborg Slotssogn kirkebog 1808", "LL:2-80373", "LL:3-51002", "LL:11-5877418", "LL:14-7607995", "PHT:1897", "Geni: Ove Samuel Gedde (1778–1843)"], "res": [[1808, "Fredensborg", "kaptajn; sønnen Ove Frederik født"], [1834, "Helsingør", "oberstløjtnant, Kronens Regiment"], [1843, "Helsingør", "død"]], "father": "p432", "mother": "p433", "living": false, "sibof": null, "step": null, "spouse": "p217"}, {"id": "p217", "name": "Frederikke Louise Dorthea von Kleist", "sex": "F", "ahnen": 217, "line": "gedde", "rel": null, "born": "1786-01-05", "bplace": null, "died": "1870-01-24", "dplace": null, "occ": [], "conf": "record", "note": "Kirkebogen 1808 kalder hende 'Frederikke Lovise Birthe født Kleist'. Datter af kammerherre Christian Frederik von Kleist. Hendes søster Christine Sophie var gift med pastor Hammer i Herlufmagle, og søsteren Juliane med den norske generalmajor Nicolai Wilhelm Gedde, sandsynligvis Ove Samuels bror.", "src": ["PHT:1897", "LL:2-80374", "LL:3-51003", "AO:Fredensborg Slotssogn kirkebog 1808"], "res": [[1834, "Helsingør", "officershustru"]], "father": "p434", "mother": "p435", "living": false, "sibof": null, "step": null, "spouse": "p216"}, {"id": "p432", "name": "Hans Christopher Gedde", "sex": "M", "ahnen": 432, "line": "gedde", "rel": null, "born": "1738", "bplace": null, "died": "1817", "dplace": null, "occ": ["Generalmajor (dansk-norsk hæ function render(){
  const G=+gs.value, side=+$('side').value, T=THEMES[$('style').value], showSibs=$('sibs').checked, colorLines=$('lines').checked;

    el('ellipse',{cx:0,cy:-6,rx:37,ry:45,fill:T.medal,stroke:ring,'stroke-width':colorLines&&p?4:1.5},c);
    el('path',{d:sil,transform:'translate(0,-4) scale(1.15)',fill:p?T.sil:'none',stroke:p?'none':T.sil,'stroke-dasharray':p?'':'3 3',opacity:p?.75:.6},c);
    if(p&&p.conf!=='record'&&p.conf!=='told') el('text',{x:0,y:-38,'text-anchor':'middle',style:'font-family:var(--f-display)','font-size':12,fill:T.ink2},c).textContent='?';
    const name=p?clean(p.name):(n%2?'Ukendt mor':'Ukendt far');
    const lines=wrap(name, 20);
    const sib = showSibs&&p ? siblingsOf(p) : [];
    const sibLine = sib.length ? 'Søskende: '+sib.slice(0,3).map(q=>clean(q.name).split(' ')[0]+(yr(q.born)?` ${yr(q.born)}`:'')).join(', ')+(sib.length>3?` +${sib.length-3}`:'') : '';
    const sibLines = sibLine? wrap(sibLine, 30) : [];
    const ph = 22 + lines.length*17 + (p&&life(p)?15:0) + (p&&p.bplace?14:0) + sibLines.length*13;
    el('rect',{x:-76,y:50,width:152,height:ph,rx:5,fill:T.plate,stroke:T.plateEdge,'stroke-width':1.2},c);
    el('path',{d:`M-76,${58} l-10,-6 l0,${ph-4} l10,-6`,fill:T.plate,stroke:T.plateEdge,'stroke-width':1.2},c);
    el('path',{d:`M76,${58} l10,-6 l0,${ph-4} l-10,-6`,fill:T.plate,stroke:T.plateEdge,'stroke-width':1.2},c);
    let ty=68;
    lines.forEach(t=>{ el('text',{x:0,y:ty,'text-anchor':'middle',style:'font-family:var(--f-display)','font-size':15.5,fill:p?T.ink:T.ink2},c).textContent=t; ty+=17; });
    if(p&&life(p)){ el('text',{x:0,y:ty,'text-anchor':'middle',style:'font-family:var(--f-display)','font-size':12.5,'font-style':'italic',fill:T.ink2},c).textContent=life(p); ty+=15; }
    if(p&&p.bplace){ el('text',{x:0,y:ty,'text-anchor':'middle',style:'font-family:var(--f-body)','font-size':10.5,fill:T.ink2},c).textContent=p.bplace; ty+=14; }
    sibLines.forEach(t=>{ el('text',{x:0,y:ty,'text-anchor':'middle',style:'font-family:var(--f-body)','font-size':9.5,fill:T.ink2},c).textContent=t; ty+=13; });
  }

  // generationsetiketter
  for(let g=0; g<=gmax; g++){ const y=TOPPAD+(gmax-g)*ROW+70;
    const lab=['Dig','Forældre','Bedsteforældre','Oldeforældre','Tipoldeforældre','Tiptipoldeforældre'][g]||`${g+1}. generation`;
    el('text',{x:58,y:y-4,style:'font-family:var(--f-sc)','font-size':15,fill:T.ink2,'letter-spacing':'.06em'},svg).textContent=lab;
    const yrs=Object.keys(slots).map(Number).filter(n=>genOf(n)===g&&slots[n]).map(n=>yr(slots[n].born)).filter(Boolean);
    if(yrs.length) el('text',{x:58,y:y+14,style:'font-family:var(--f-display)','font-size':12,'font-style':'italic',fill:T.ink2},svg).textContent=`født ${Math.min(...yrs)}${Math.max(...yrs)!==Math.min(...yrs)?'–'+Math.max(...yrs):''}`;
  }

  // titelbanner
  const by=H-118, bw=Math.min(900, W*.6), bx=W/2;
  const ban=el('g',{},svg);
  el('path',{d:`M${bx-bw/2-70},${by-10} l40,0 l-18,30 l18,30 l-40,0 Z`,fill:T.plate,stroke:T.plateEdge,'stroke-width':2},ban);
  el('path',{d:`M${bx+bw/2+70},${by-10} l-40,0 l18,30 l-18,30 l40,0 Z`,fill:T.plate,stroke:T.plateEdge,'stroke-width':2},ban);
  el('path',{d:`M${bx-bw/2},${by-26} Q${bx},${by-44} ${bx+bw/2},${by-26} L${bx+bw/2},${by+56} Q${bx},${by+38} ${bx-bw/2},${by+56} Z`,fill:T.plate,stroke:T.plateEdge,'stroke-width':2.5},ban);
  const sideTxt={1:'',2:' · fars side',3:' · mors side'}[side];
  el('text',{x:bx,y:by+18,'text-anchor':'middle',style:'font-family:var(--f-sc)','font-size':44,fill:T.title,'letter-spacing':'.04em'},ban).textContent='Slægten Gårdsted · Gedde';
  el('text',{x:bx,y:by+86,'text-anchor':'middle',style:'font-family:var(--f-display)','font-size':17,'font-style':'italic',fill:T.ink2},ban).textContent=`Johannes Gårdsted Valbjørns aner${sideTxt} · ${gmax+1} generationer · efter kirkebøger og folketællinger`;
  applyVB();
}
function wrap(t,n){ const w=t.split(' '); const out=[]; let cur=''; for(const x of w){ if((cur+' '+x).trim().length>n && cur){ out.push(cur); cur=x; } else cur=(cur+' '+x).trim(); } if(cur) out.push(cur); return out.slice(0,3); }

// ---------- zoom og panorering ----------
const stage=$('stage');
function applyVB(){ svg.setAttribute('viewBox',VB.join(' ')); }
function zoomAt(f,cx,cy){ const r=svg.getBoundingClientRect(); const sx=VB[2]/r.width, sy=VB[3]/r.height, s=Math.max(sx,sy);
  const px=VB[0]+(cx-r.left - (r.width-VB[2]/s)/2)*s, py=VB[1]+(cy-r.top-(r.height-VB[3]/s)/2)*s;
  const nw=Math.min(FULL[2]*1.5, Math.max(FULL[2]/30, VB[2]/f)), nh=VB[3]*nw/VB[2];
  VB=[px-(px-VB[0])*nw/VB[2], py-(py-VB[1])*nh/VB[3], nw, nh]; applyVB(); }
stage.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY); },{passive:false});
const pts=new Map(); let last=null, lastD=null;
stage.addEventListener('pointerdown',e=>{ stage.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]); stage.classList.add('drag'); last=[e.clientX,e.clientY]; lastD=null; });
stage.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,[e.clientX,e.clientY]);
  const r=svg.getBoundingClientRect(), s=Math.max(VB[2]/r.width,VB[3]/r.height);
  if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); if(lastD) zoomAt(d/lastD,(a[0]+b[0])/2,(a[1]+b[1])/2); lastD=d; return; }
  if(last){ VB[0]-=(e.clientX-last[0])*s; VB[1]-=(e.clientY-last[1])*s; applyVB(); } last=[e.clientX,e.clientY]; });
const up=e=>{ pts.delete(e.pointerId); if(!pts.size){ stage.classList.remove('drag'); last=null; } lastD=null; };
stage.addEventListener('pointerup',up); stage.addEventListener('pointercancel',up);
const mid=()=>{ const r=svg.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; };
$('zin').onclick=()=>zoomAt(1.3,...mid()); $('zout').onclick=()=>zoomAt(1/1.3,...mid()); $('zfit').onclick=()=>{ VB=FULL.slice(); applyVB(); };
$('paper').onchange=()=>{ $('pagestyle').textContent=`@page{size:${$('paper').value} landscape;margin:0}`; };
$('print').onclick=()=>{ VB=FULL.slice(); applyVB(); window.print(); };
['gens','side','style','sibs','lines'].forEach(id=>$(id).addEventListener('change',render));
// forudvalg via #anker, fx #g7-mor-lys
const h=location.hash.slice(1); if(h){ const m=h.match(/g(\d+)/); if(m&&gs.querySelector(`option[value="${m[1]}"]`)) gs.value=m[1];
  if(/far/.test(h)) $('side').value='2'; if(/mor/.test(h)) $('side').value='3'; if(/lys/.test(h)) $('style').value='light'; if(/sosk/.test(h)) $('sibs').checked=true; }
render();
window.__posterReady=true;
})();
</script>

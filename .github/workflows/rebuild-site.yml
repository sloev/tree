name: Rebuild family tree website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-site.yml'
      - 'data/**'
      - '!data/family.json'
      - '!data/recently-edited.json'
      - 'site/template.html'
      - 'site/build.py'
      - 'site/poster.html'
      - 'site/unlock.js'
      - 'tools/mark_recent_people.py'
      - 'leads/**'
      - 'research-archive/**'
      - 'coop.log.md'
      - 'README.md'
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-family-tree-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Mark recently edited people from source-data diff
        env:
          BASE_SHA: ${{ github.event.before || github.sha }}
        run: python3 tools/mark_recent_people.py "$BASE_SHA" "$GITHUB_SHA"
      - name: Rebuild canonical data, GEDCOM and website
        run: |
          python3 data/build_data.py
          python3 data/export.py
          python3 site/build.py
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/family.json data/recently-edited.json family-tree.ged site/index.html site/plakat.html docs/index.html docs/plakat.html docs/.nojekyll
          if git diff --cached --quiet; then
            echo "Generated outputs are already up to date."
            exit 0
          fi
          git commit -m "Rebuild family tree website"
          git push origin HEAD:main

name: Build unified interactive genealogy site from reviewed Markdown

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "!content/activity.md"
      - "images/**"
      - "media/files/**"
      - "site/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/rebuild-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-family-tree-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Add a newsbulletin story for this publication or research update
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.sha }}
        run: python3 scripts/update_newsbulletin.py --before "$EVENT_BEFORE" --after "$EVENT_AFTER"
      - name: Validate Markdown source
        run: |
          python3 scripts/compile_content.py --check
          python3 scripts/check_local_links.py
          python3 scripts/check_integrity.py
          python3 scripts/check_external_links.py
      - name: Generate GEDCOM and unified interactive site
        run: |
          set -euo pipefail
          python3 scripts/compile_content.py
          python3 site/build.py
          python3 scripts/check_generated_links.py
          test -s family-tree.ged
          test -s docs/index.html
          test -s docs/persons/index.html
          test -s docs/places/index.html\n          test -s docs/sources/index.html\n          test -s docs/media/index.html || true
          test -s docs/research/index.html
          test -d docs/people\n          test -s docs/sources/$(find content/sources -maxdepth 1 -name "*.md" | head -n 1 | sed "s#content/sources/##;s#\\.md#.html#")
          test -d docs/places
          grep -q '1 FAMS ' family-tree.ged
          grep -q '1 FAMC ' family-tree.ged
          grep -q 'const DATA = {"people":' docs/index.html
          grep -q 'function renderPed' docs/index.html\n          grep -q 'place_details' docs/index.html\n          grep -q 'source_details' docs/index.html\n          grep -q '__showPlaceRecord' docs/index.html
          grep -q 'id="stamtrae"' docs/index.html
          test ! -e data/tree.json
          ! grep -R -q 'tree.json' docs/index.html docs/persons docs/research
      - name: Rebuild from latest main and commit generated outputs
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/update_newsbulletin.py --before "$EVENT_BEFORE" --after "$EVENT_AFTER"
            python3 scripts/compile_content.py --check
            python3 scripts/check_local_links.py
            python3 scripts/check_integrity.py
            python3 scripts/check_external_links.py
            python3 scripts/compile_content.py
            python3 site/build.py
            python3 scripts/check_generated_links.py
            git add -A docs family-tree.ged build/family-tree.ged content/activity.md
            if git diff --cached --quiet; then
              echo "Generated outputs already current."
              exit 0
            fi
            git commit -m "Build public site and bulletin from reviewed research"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race on attempt $attempt; retrying from latest main."
          done
          echo "Could not push generated outputs after three retries." >&2
          exit 1
